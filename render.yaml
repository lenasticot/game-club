services:
  - type: web
    name: gameclub-entry-site
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: bash render-start.sh
    envVars:
      - key: FLASK_SECRET_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: RAWG_API_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: DISCORD_APPLICATION_ID
        sync: false
      - key: DISCORD_PLAYERS
        sync: false
      - key: DISCORD_ADMINS
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
