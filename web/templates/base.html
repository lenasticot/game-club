<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Game Club{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('home') }}" class="brand">Game Club</a>
    {% if session.get('player_id') %}
      <nav class="nav">
        <a href="{{ url_for('home') }}">My list</a>
        <a href="{{ url_for('players_page') }}">Everyone's lists</a>
        <a href="{{ url_for('games_page') }}">All games</a>
      </nav>
      <form action="{{ url_for('logout') }}" method="post" class="inline">
        <button type="submit" class="link">not you?</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
